name: Keep Streamlit apps awake

on:
  schedule:
    - cron: '0 */6 * * *'   # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক রান হবে
  workflow_dispatch:         # অ্যাকশন ট্যাব থেকে ম্যানুয়ালি রান করার অপশন

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: |
            https://ramim-ai.streamlit.app/
