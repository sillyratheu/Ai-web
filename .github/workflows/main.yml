name: Keep Streamlit apps awake (Playwright)

on:
  schedule:
    - cron: '0 */6 * * *'   # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক রান হবে
  workflow_dispatch:         # ম্যানুয়ালি রান করার অপশন

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Playwright Scroll & Click Bot
        run: |
          python -c "
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              print('Launching browser...')
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print('Navigating to Streamlit app...')
              page.goto('https://ramim-ai.streamlit.app/', timeout=60000)
              page.wait_for_load_state('networkidle')
              
              print('Scrolling down...')
              page.evaluate('window.scrollBy(0, 700)')
              time.sleep(3)
              
              print('Scrolling back up...')
              page.evaluate('window.scrollBy(0, -700)')
              time.sleep(2)
              
              print('Clicking page body...')
              try:
                  page.click('body', timeout=5000)
              except:
                  pass
                  
              print('Playwright simulation completed successfully!')
              browser.close()
          "
          
